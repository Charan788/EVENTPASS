<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="EventPass event management demo" />
    <title>EventPass — Event Ticketing</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
      rel="stylesheet"
    />
    <link href="styles.css" rel="stylesheet" />
  </head>
  <body>
    <a class="skip-link" href="#mainContent">Skip to main content</a>
    <header class="topbar">
      <button
        class="menu-button"
        type="button"
        data-bs-toggle="offcanvas"
        data-bs-target="#mobileNav"
        aria-controls="mobileNav"
        aria-label="Open navigation"
      >
        <i class="bi bi-list"></i>
      </button>
      <a class="brand" href="#home" data-route="home"
        ><span class="brand-icon"><i class="bi bi-ticket-perforated-fill"></i></span> EventPass
        <span class="version-badge">v4.0</span></a
      >
      <div class="role-control">
        <span id="roleCaption" class="role-label">Organizer workspace</span>
        <div id="roleSwitch" class="role-switch" role="group" aria-label="Choose workspace">
          <button
            class="role-choice active"
            type="button"
            data-set-role="organizer"
            aria-pressed="true"
          >
            <i class="bi bi-calendar2-check" aria-hidden="true"></i><span>Organizer</span>
          </button>
          <button class="role-choice" type="button" data-set-role="attendee" aria-pressed="false">
            <i class="bi bi-person-badge" aria-hidden="true"></i><span>Attendee</span>
          </button>
        </div>
      </div>
    </header>

    <div class="app-frame">
      <aside class="sidebar" aria-label="Main navigation">
        <p class="nav-heading" id="navHeading">Organizer workspace</p>
        <nav class="nav flex-column">
          <a class="nav-link" href="#home" data-route="home"><i class="bi bi-house"></i> Home</a>
          <a class="nav-link" href="#events" data-route="events" data-role-nav="organizer"
            ><i class="bi bi-calendar-event"></i> Events</a
          >
          <a
            class="nav-link"
            href="#create-event"
            data-route="create-event"
            data-role-nav="organizer"
            ><i class="bi bi-plus-circle"></i> Create event</a
          >
          <a
            class="nav-link"
            href="#issue-passes"
            data-route="issue-passes"
            data-role-nav="organizer"
            ><i class="bi bi-ticket"></i> Issue passes</a
          >
          <a
            class="nav-link"
            href="#attendee-pass"
            data-route="attendee-pass"
            data-role-nav="attendee"
            ><i class="bi bi-person-badge"></i> My passes</a
          >
          <a
            class="nav-link"
            href="#browse-events"
            data-route="browse-events"
            data-role-nav="attendee"
            ><i class="bi bi-calendar2-week"></i> Browse events</a
          >
          <a class="nav-link" href="#scanner" data-route="scanner" data-role-nav="organizer"
            ><i class="bi bi-qr-code-scan"></i> Scanner</a
          >
          <a class="nav-link" href="#dashboard" data-route="dashboard" data-role-nav="organizer"
            ><i class="bi bi-bar-chart"></i> Dashboard</a
          >
          <a class="nav-link" href="#about" data-route="about"
            ><i class="bi bi-info-circle"></i> About</a
          >
        </nav>
      </aside>

      <div
        class="offcanvas offcanvas-start"
        tabindex="-1"
        id="mobileNav"
        aria-labelledby="mobileNavLabel"
      >
        <div class="offcanvas-header">
          <h2 class="offcanvas-title" id="mobileNavLabel">EventPass</h2>
          <button
            class="btn-close"
            type="button"
            data-bs-dismiss="offcanvas"
            aria-label="Close"
          ></button>
        </div>
        <div class="offcanvas-body">
          <p class="nav-heading" id="mobileNavHeading">Organizer workspace</p>
          <nav class="nav flex-column">
            <a class="nav-link" href="#home" data-route="home">Home</a>
            <a class="nav-link" href="#events" data-route="events" data-role-nav="organizer"
              >Events</a
            >
            <a
              class="nav-link"
              href="#create-event"
              data-route="create-event"
              data-role-nav="organizer"
              >Create event</a
            >
            <a
              class="nav-link"
              href="#issue-passes"
              data-route="issue-passes"
              data-role-nav="organizer"
              >Issue passes</a
            >
            <a
              class="nav-link"
              href="#attendee-pass"
              data-route="attendee-pass"
              data-role-nav="attendee"
              >My passes</a
            >
            <a
              class="nav-link"
              href="#browse-events"
              data-route="browse-events"
              data-role-nav="attendee"
              >Browse events</a
            >
            <a class="nav-link" href="#scanner" data-route="scanner" data-role-nav="organizer"
              >QR scanner</a
            >
            <a class="nav-link" href="#dashboard" data-route="dashboard" data-role-nav="organizer"
              >Dashboard</a
            >
            <a class="nav-link" href="#about" data-route="about">About</a>
          </nav>
        </div>
      </div>

      <main id="mainContent" tabindex="-1">
        <div id="alertBanner" class="alert d-none" role="status" aria-live="polite"></div>
        <div id="screenContent"></div>
      </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script src="js/store.js"></script>
    <script src="js/qr.js"></script>
    <script src="js/validator.js"></script>
    <script src="js/views.js"></script>
    <script src="js/app.js"></script>
  </body>
</html>
